[package]
name = "designdump"
version = "0.1.0"
edition = "2024"
description = "Turns design files saved from Figma (.fig) into HTML, CSS and design tokens that AI agents and developers can read"
license = "MIT OR Apache-2.0"
repository = "https://github.com/soerenmeier/designdump"
readme = "README.md"
keywords = ["figma", "design", "html", "css", "ai"]
categories = ["command-line-utilities", "development-tools", "web-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
imagesize = "0.15.0"
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
zip = "9.1.3"
zstd = "0.14.3"
